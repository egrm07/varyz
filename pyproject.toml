[project]
# The distribution is varyzai, after the brand and its domain; the module, the
# command and every path on disk are varyz. Until 2026-09-24 all of them said
# varys -- src/varyz/legacy.py carries an existing install across.
name = "varyzai"
version = "0.1.3"
description = "Local-first personal context engine — one memory every AI agent can read"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE.additional-terms", "NOTICE"]
authors = [{ name = "Egor Menshikov" }]
keywords = [
    "personal-knowledge-management",
    "local-first",
    "mcp",
    "model-context-protocol",
    "memory",
    "privacy",
    "sqlite",
    "llm",
]
# No "License ::" classifier on purpose. The licence is declared as an SPDX
# expression above, and PEP 639 deprecates carrying both — some build backends
# now refuse the pair outright.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
# No "Typing :: Typed" either. It tells an installer that this package ships
# types for code that imports it, which requires a py.typed marker that has
# never been here, and it is checked by nothing: no type checker runs on this
# repository. Varyz is a program people run, not a library people import.
# Put both back together, or neither.
dependencies = [
    "anthropic>=0.116.0",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "openai>=2.44.0",
    "openpyxl>=3.1.5",
    # Draws the PNG of `varyz wrapped` (the Taste Card). fastembed already
    # installs it; it is named here so the card cannot lose its renderer when
    # fastembed changes its own dependencies. Imported only when a PNG is drawn.
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "python-ulid>=3.1.0",
    "rich>=15.0.0",
    "sqlite-vec>=0.1.9",
    "tomlkit>=0.13.3",
    "typer>=0.26.8",
]

[project.scripts]
# main(), not app(): it wraps the Typer app so a held write lock and a Ctrl-C
# come out as sentences rather than tracebacks.
varyz = "varyz.cli:main"

[project.optional-dependencies]
cloud = [
    "cryptography>=46,<50",
    # 4.14.2 fixes TLS hostname handling and process privilege/availability bugs.
    "anyio>=4.14.2,<5",
    "email-validator>=2.3,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20,<1",
    "psycopg[pool,binary]>=3.2,<4",
    # The image installs the package with --no-deps, so the base dependencies
    # the server imports at startup are repeated here (IDs and console output).
    "python-ulid>=3.1.0",
    "rich>=15.0.0",
]

cloud-search = ["fastembed>=0.8.0"]

# Repository links match the source URL in NOTICE and LICENSE.additional-terms.
# The product homepage is the main download entry point.
[project.urls]
Homepage = "https://varyzai.com"
Repository = "https://github.com/egrm07/varyz"
Documentation = "https://github.com/egrm07/varyz/tree/main/docs"
Issues = "https://github.com/egrm07/varyz/issues"
Changelog = "https://github.com/egrm07/varyz/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# ONNX Runtime stopped shipping Intel Mac wheels after 1.23.2.
# Native installers bundle Python 3.12; preserve other platforms' existing version.
constraint-dependencies = [
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version < '3.14'",
]
# uv reuses a local directory's build until pyproject.toml changes, so
# `uv tool install .` (and `install.sh --package .`) quietly installed the
# previous code after an edit -- a checkout without `varyz setup`, say. Any
# change to what goes into the wheel now means a fresh build.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
    { file = "src/**/*.sql" },
    { file = "src/**/*.toml" },
    { file = "src/**/*.md" },
    { file = "src/**/*.html" },
    { file = "src/**/*.js" },
    { file = "src/**/*.css" },
    { file = "src/**/*.json" },
    { file = "src/**/*.txt" },
]

[tool.uv.build-backend]
# Without this the backend would derive the module name from the distribution
# name and look for src/varyzai/.
module-name = "varyz"
# Connectors held back from the alpha (docs/SHIPPING.md). They stay in the tree,
# where their tests run, and are left out of both the sdist and the wheel;
# varyz.connectors.HELD_BACK registers them only where the module exists.
# icalendar and imapclient, which only they use, are dev dependencies for now.
source-exclude = [
    "src/varyz/connectors/calendar_ics.py",
    "src/varyz/connectors/gmail_imap.py",
    "src/varyz/connectors/google_auth.py",
    "src/varyz/connectors/google_gmail.py",
    "src/varyz/connectors/google_workspace.py",
    "src/varyz/connectors/personal_archive.py",
    # `varyz enrich`, held back the same way: the command registers only where
    # this module exists.
    "src/varyz/pipeline/enrich.py",
    # The managed model's installer: the alpha never downloads gemma, and
    # `varyz local-model install` registers only where this module exists.
    "src/varyz/llm/local_install.py",
    # The personal-model compiler: on a weak laptop it ran hot for minutes after
    # every graph update, and nothing the alpha answers came from it. `varyz
    # model`, `lookup` and `interpret` register only where compiler.py exists.
    "src/varyz/personal_model/annotation_wire.py",
    "src/varyz/personal_model/cloud_runtime.py",
    "src/varyz/personal_model/compiler.py",
    "src/varyz/personal_model/identity.py",
    "src/varyz/personal_model/observations.py",
    "src/varyz/personal_model/readiness.py",
    "src/varyz/personal_model/relationships.py",
    "src/varyz/personal_model/semantic_runtime.py",
    "src/varyz/personal_model/synthesis.py",
    "src/varyz/personal_model/validation.py",
    # The graph builder: it read every entry for a graph no answer used (the
    # 2026-10-22 A/B: no graph table read in 100 answers, the same answers
    # without it). `varyz graph` and the setup step register only where
    # service.py exists. Its records, overrides and temporal parsing ship.
    "src/varyz/graph/cache.py",
    "src/varyz/graph/cadence.py",
    "src/varyz/graph/doctor.py",
    "src/varyz/graph/evaluation.py",
    "src/varyz/graph/extract.py",
    "src/varyz/graph/identity.py",
    "src/varyz/graph/languages.py",
    "src/varyz/graph/prune.py",
    "src/varyz/graph/repository.py",
    "src/varyz/graph/semantic.py",
    "src/varyz/graph/service.py",
    "src/varyz/graph/situation.py",
    # Graph search, which only the graph's own tests call.
    "src/varyz/retrieval/graph_search.py",
    # Conversation windows: 20 recall questions answered the same with and
    # without them (2026-10-22), and every sync re-cut, embedded and read
    # them. `varyz conversations` registers only where windows.py exists.
    "src/varyz/pipeline/conclusions.py",
    "src/varyz/pipeline/quoting.py",
    "src/varyz/pipeline/window_vectors.py",
    "src/varyz/pipeline/windows.py",
    "src/varyz/retrieval/conversation_evidence.py",
    "src/varyz/retrieval/conversations.py",
]

[dependency-groups]
dev = [
    "icalendar>=6.3.2",
    "imapclient>=3.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".tmp*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests that call real cloud APIs (deselect with '-m \"not live\"')"]
addopts = "-m 'not live'"
