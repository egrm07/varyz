name: Windows native acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    if: github.repository == 'egrm07/varyz'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      UV_MANAGED_PYTHON: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.2
          enable-cache: false
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Build from locked inputs on the clean runner
        run: uv run --no-sync python scripts/windows/ci_build.py
      - name: Verify source and launch the exact EXE in isolated paths
        shell: pwsh
        run: |
          $proof = Get-Content dist/native-ci/native-release-provenance.json -Raw | ConvertFrom-Json
          if ($proof.revision -ne $env:GITHUB_SHA -or $proof.working_tree_dirty) { throw 'Unexpected source provenance' }
          $exe = Get-Item dist/native-ci/VaryzSetup-*-windows-x64.exe
          $env:EXPECTED_EXE_SHA256 = $proof.artifacts.PSObject.Properties[$exe.Name].Value
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:EXPECTED_EXE_SHA256) { throw 'Installer changed after provenance capture' }
          $env:EXPECTED_SOURCE_COMMIT = $env:GITHUB_SHA
          uv run --no-sync python scripts/windows/ci_acceptance.py $exe.FullName
      - name: Retain synthetic acceptance receipts; hold the unsigned installer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Varyz-Windows-native-acceptance
          path: |
            dist/native-ci/native-release-provenance.json
            dist/native-ci/native-release-checksums.json
            ${{ runner.temp }}/varyz-native-acceptance/verified.json
          if-no-files-found: warn
          retention-days: 14
