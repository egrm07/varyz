name: Older SQLite compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-340:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install pinned uv
        run: python -m pip install uv==0.11.2
      - name: Keep system Python and its older SQLite
        run: |
          python -c "import sqlite3; print(sqlite3.sqlite_version); assert sqlite3.sqlite_version_info < (3, 41)"
          uv sync --frozen --extra cloud --python /usr/local/bin/python3.12
      - name: Exercise actual vector searches and bootstrap
        run: uv run --no-sync pytest -q tests/test_search.py tests/test_vector_pool.py tests/test_conversation_windows.py tests/test_bootstrap.py --junitxml=sqlite-compatibility.xml
      - name: Retain result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Varyz-SQLite-340-compatibility
          path: sqlite-compatibility.xml
          if-no-files-found: warn
          retention-days: 14
